<div class="min-h-screen bg-gradient-to-br from-green-50 via-white to-orange-50 p-6">
  
  <!-- Header -->
  <div class="mb-8">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <button (click)="navigateToDashboard()" 
                class="bg-white p-2 rounded-lg shadow hover:shadow-md transition-shadow">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <div>
          <h1 class="text-3xl font-bold text-gray-800">Upload Images</h1>
          <p class="text-gray-600">Upload mango images for disease classification</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Section -->
  <div class="bg-white rounded-xl shadow-lg p-8 text-center">
    <div class="text-6xl mb-4">📷</div>
    <h2 class="text-2xl font-bold text-gray-800 mb-2">Upload Images</h2>
    <p class="text-gray-600 mb-8">This feature will be integrated with your Django backend</p>
    
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-12 mb-6">
      <div class="text-4xl mb-4">📤</div>
      <p class="text-lg text-gray-600 mb-4">Drag and drop images here or click to browse</p>
      <button class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition-colors">
        Select Images
      </button>
    </div>
    
    <p class="text-sm text-gray-500">Supported formats: JPG, PNG, JPEG</p>
  </div>
</div>

<div class="min-h-screen bg-gradient-to-br from-green-50 via-white to-orange-50 p-6">
  
  <!-- Header -->
  <div class="mb-8">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-4">
        <button (click)="navigateToDashboard()" 
                class="bg-white p-2 rounded-lg shadow hover:shadow-md transition-shadow">
          <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
        </button>
        <div>
          <h1 class="text-3xl font-bold text-gray-800">Model Settings</h1>
          <p class="text-gray-600">Configure your machine learning model</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Section -->
  <div class="bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <div class="text-6xl mb-4">⚙️</div>
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Model Configuration</h2>
      <p class="text-gray-600">Manage your AI model settings and performance</p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-gray-50 rounded-lg p-6 text-center">
        <div class="text-3xl mb-2">🎯</div>
        <h3 class="font-semibold text-gray-800 mb-2">Model Accuracy</h3>
        <p class="text-2xl font-bold text-green-600">94.5%</p>
      </div>
      
      <div class="bg-gray-50 rounded-lg p-6 text-center">
        <div class="text-3xl mb-2">📊</div>
        <h3 class="font-semibold text-gray-800 mb-2">Training Data</h3>
        <p class="text-2xl font-bold text-blue-600">1,500 images</p>
      </div>
      
      <div class="bg-gray-50 rounded-lg p-6 text-center">
        <div class="text-3xl mb-2">🔄</div>
        <h3 class="font-semibold text-gray-800 mb-2">Last Updated</h3>
        <p class="text-2xl font-bold text-purple-600">2 days ago</p>
      </div>
    </div>
    
    <div class="mt-8 text-center">
      <button class="bg-green-600 text-white px-8 py-3 rounded-lg hover:bg-green-700 transition-colors mr-4">
        Retrain Model
      </button>
      <button class="bg-blue-600 text-white px-8 py-3 rounded-lg hover:bg-blue-700 transition-colors">
        Export Model
      </button>
    </div>
  </div>
</div>
